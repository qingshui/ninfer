<text x="24" y="412" font-size="10.5" text-anchor="start" class="f-muted">fraction (0.827); the final builds divide by requests finished in their 5 s windows (480 canonical, 411 original).</text>
<text x="24" y="426" font-size="10.5" text-anchor="start" class="f-muted">Profiled runs are slower than unprofiled ones. Segment labels are ms per request and appear only where they fit.</text>
