<text x="24" y="498" font-size="10.5" text-anchor="start" class="f-muted">Run-to-run spread in phase A was about 0.5 req/s, so differences among the controller rows are not resolved by single runs.</text>
<text x="24" y="512" font-size="10.5" text-anchor="start" class="f-muted">Lineage-first eviction was on for caps 290 and 330 (cap 330 without it: 57.33); the notes do not record it for caps 380 to 700.</text>
<text x="24" y="526" font-size="10.5" text-anchor="start" class="f-muted">The 1/24 row had persistent skipped checkpoints and was not chosen; 1/20 had none in steady state. Rows are runs 23 to 35.</text>
