<path d="M30,450H208A6,6 0 0 1 214,456V514A6,6 0 0 1 208,520H30A6,6 0 0 1 24,514V456A6,6 0 0 1 30,450Z" class="f-surface s-axis" stroke-width="1"><title>Same GEMM</title></path>
<text x="119" y="474.35" font-size="11" text-anchor="middle" class="f-ink1" font-weight="700">Down GEMM</text>
<text x="119" y="488.85" font-size="11" text-anchor="middle" class="f-ink1">per-slot outputs</text>
<text x="119" y="503.35" font-size="11" text-anchor="middle" class="f-ink1">fp32, per token</text>
<path d="M244,450H422A6,6 0 0 1 428,456V514A6,6 0 0 1 422,520H244A6,6 0 0 1 238,514V456A6,6 0 0 1 244,450Z" class="f-s1 s-s1" stroke-width="1.25" fill-opacity="0.16"><title>No atomics</title></path>
