<rect class="f-surface" width="880" height="616"/>
<text x="24" y="30" font-size="16" text-anchor="start" class="f-ink1" font-weight="700">MoE: gate/up producer and combine, before and after</text>
<text x="24" y="50" font-size="12" text-anchor="start" class="f-ink2">Schematic, not to scale. Orange boxes are replaced by the blue ones.</text>
<text x="24" y="88" font-size="13" text-anchor="start" class="f-ink1" font-weight="700">1. Gate/up GEMM: remove the gather4 producer bottleneck</text>
<text x="24" y="104" font-size="11" text-anchor="start" class="f-muted" font-weight="700">Before</text>
<path d="M30,110H208A6,6 0 0 1 214,116V174A6,6 0 0 1 208,180H30A6,6 0 0 1 24,174V116A6,6 0 0 1 30,110Z" class="f-s2 s-s2" stroke-width="1.25" fill-opacity="0.16"><title>The producer spent about 83% of the kernel in issue, about 1870 cycles per stage</title></path>
<text x="119" y="127.1" font-size="11" text-anchor="middle" class="f-ink1" font-weight="700">Producer warp</text>
<text x="119" y="141.6" font-size="11" text-anchor="middle" class="f-ink1">16 TMA gather4 per</text>
<text x="119" y="156.1" font-size="11" text-anchor="middle" class="f-ink1">stage, about 94</text>
<text x="119" y="170.6" font-size="11" text-anchor="middle" class="f-ink1">cycles each</text>
<path d="M244,110H422A6,6 0 0 1 428,116V174A6,6 0 0 1 422,180H244A6,6 0 0 1 238,174V116A6,6 0 0 1 244,110Z" class="f-s2 s-s2" stroke-width="1.25" fill-opacity="0.16"><title>Gate/up ran at about 453 us for 3700 tokens</title></path>
<text x="333" y="134.35" font-size="11" text-anchor="middle" class="f-ink1" font-weight="700">MMA warp starved</text>
<text x="333" y="148.85" font-size="11" text-anchor="middle" class="f-ink1">tensor cores wait</text>
<text x="333" y="163.35" font-size="11" text-anchor="middle" class="f-ink1">for the next stage</text>
<line x1="217" y1="145" x2="231" y2="145" class="s-ink2" stroke-width="1.5" stroke-linecap="butt"/>
<polygon points="236,145 228,149 228,141" class="f-ink2"/>
<path d="M458,110H636A6,6 0 0 1 642,116V174A6,6 0 0 1 636,180H458A6,6 0 0 1 452,174V116A6,6 0 0 1 458,110Z" class="f-surface s-axis" stroke-width="1"><title>SwiGLU and NVFP4 quantization</title></path>
<text x="547" y="134.35" font-size="11" text-anchor="middle" class="f-ink1" font-weight="700">Epilogue</text>
<text x="547" y="148.85" font-size="11" text-anchor="middle" class="f-ink1">IEEE expf and</text>
<text x="547" y="163.35" font-size="11" text-anchor="middle" class="f-ink1">division chains</text>
<line x1="431" y1="145" x2="445" y2="145" class="s-ink2" stroke-width="1.5" stroke-linecap="butt"/>
<polygon points="450,145 442,149 442,141" class="f-ink2"/>
<path d="M672,110H850A6,6 0 0 1 856,116V174A6,6 0 0 1 850,180H672A6,6 0 0 1 666,174V116A6,6 0 0 1 672,110Z" class="f-surface s-axis" stroke-width="1"><title>3700 tokens, skew 0.4, isolated op bench</title></path>
<text x="761" y="141.6" font-size="11" text-anchor="middle" class="f-ink1" font-weight="700">Result</text>
<text x="761" y="156.1" font-size="11" text-anchor="middle" class="f-ink1">gate/up 453 us</text>
<line x1="645" y1="145" x2="659" y2="145" class="s-ink2" stroke-width="1.5" stroke-linecap="butt"/>
<polygon points="664,145 656,149 656,141" class="f-ink2"/>
<text x="24" y="198" font-size="11" text-anchor="start" class="f-muted" font-weight="700">After</text>
<path d="M30,204H208A6,6 0 0 1 214,210V268A6,6 0 0 1 208,274H30A6,6 0 0 1 24,268V210A6,6 0 0 1 30,204Z" class="f-s1 s-s1" stroke-width="1.25" fill-opacity="0.16"><title>count, scan, index, then gather</title></path>
<text x="119" y="228.35" font-size="11" text-anchor="middle" class="f-ink1" font-weight="700">gather_input kernel</text>
<text x="119" y="242.85" font-size="11" text-anchor="middle" class="f-ink1">pre-gathers token</text>
<text x="119" y="257.35" font-size="11" text-anchor="middle" class="f-ink1">rows in one pass</text>
<path d="M244,204H422A6,6 0 0 1 428,210V268A6,6 0 0 1 422,274H244A6,6 0 0 1 238,268V210A6,6 0 0 1 244,204Z" class="f-s1 s-s1" stroke-width="1.25" fill-opacity="0.16"><title>No per-row gather4 instructions</title></path>
<text x="333" y="228.35" font-size="11" text-anchor="middle" class="f-ink1" font-weight="700">Producer warp</text>
<text x="333" y="242.85" font-size="11" text-anchor="middle" class="f-ink1">contiguous 2D TMA</text>
<text x="333" y="257.35" font-size="11" text-anchor="middle" class="f-ink1">loads</text>
<line x1="217" y1="239" x2="231" y2="239" class="s-ink2" stroke-width="1.5" stroke-linecap="butt"/>
<polygon points="236,239 228,243 228,235" class="f-ink2"/>
