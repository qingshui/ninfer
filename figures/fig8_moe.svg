<path d="M672,356H850A6,6 0 0 1 856,362V420A6,6 0 0 1 850,426H672A6,6 0 0 1 666,420V362A6,6 0 0 1 672,356Z" class="f-surface s-axis" stroke-width="1"><title>3700 tokens, isolated op bench</title></path>
