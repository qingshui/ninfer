<text x="113.31" y="545" font-size="12" text-anchor="start" class="f-ink1">routed op 480.5 to 437.7 us (op bench); end to end 65.59 to about 67.4 req/s, bundled with an ftz silu in conv</text>
<text x="24" y="574" font-size="10.5" text-anchor="start" class="f-muted">Op times come from isolated benches on GPU 1 during development and are recorded in notes; the end-to-end figures are harness runs of the stage builds.</text>
<text x="24" y="588" font-size="10.5" text-anchor="start" class="f-muted">The contributions buffer costs 768 MiB (805 MB) at the 8192-token slice limit (computed, not measured); other geometries still use the atomic form.</text>
