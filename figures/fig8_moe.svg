<text x="333" y="503.35" font-size="11" text-anchor="middle" class="f-ink1">[slot][hidden], fp32</text>
<line x1="217" y1="485" x2="231" y2="485" class="s-ink2" stroke-width="1.5" stroke-linecap="butt"/>
