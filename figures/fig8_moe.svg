<text x="547" y="221.1" font-size="11" text-anchor="middle" class="f-ink1" font-weight="700">Epilogue</text>
<text x="547" y="235.6" font-size="11" text-anchor="middle" class="f-ink1">silu_approx and a</text>
<text x="547" y="250.1" font-size="11" text-anchor="middle" class="f-ink1">shared-reciprocal</text>
<text x="547" y="264.6" font-size="11" text-anchor="middle" class="f-ink1">quantizer</text>
<line x1="431" y1="239" x2="445" y2="239" class="s-ink2" stroke-width="1.5" stroke-linecap="butt"/>
