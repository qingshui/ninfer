<path d="M672,204H850A6,6 0 0 1 856,210V268A6,6 0 0 1 850,274H672A6,6 0 0 1 666,268V210A6,6 0 0 1 672,204Z" class="f-surface s-axis" stroke-width="1"><title>3700 tokens, skew 0.4, isolated op bench</title></path>
<text x="761" y="235.6" font-size="11" text-anchor="middle" class="f-ink1" font-weight="700">Result</text>
<text x="761" y="250.1" font-size="11" text-anchor="middle" class="f-ink1">gate/up 212 us</text>
<line x1="645" y1="239" x2="659" y2="239" class="s-ink2" stroke-width="1.5" stroke-linecap="butt"/>
<polygon points="664,239 656,243 656,235" class="f-ink2"/>
<path d="M28,282H852A4,4 0 0 1 856,286V304A4,4 0 0 1 852,308H28A4,4 0 0 1 24,304V286A4,4 0 0 1 28,282Z" class="f-b100" fill-opacity="0.7"/>
<text x="34" y="299" font-size="12" text-anchor="start" class="f-ink1" font-weight="700">Measured:</text>
<text x="113.31" y="299" font-size="12" text-anchor="start" class="f-ink1">gate/up 453 to 212 us, routed op 765 to 481.5 us (op bench); end to end 59.45 to 65.59 req/s</text>
<text x="24" y="334" font-size="13" text-anchor="start" class="f-ink1" font-weight="700">2. Combine: fixed-order sum instead of fp32 atomics</text>
<text x="24" y="350" font-size="11" text-anchor="start" class="f-muted" font-weight="700">Before</text>
<path d="M30,356H208A6,6 0 0 1 214,362V420A6,6 0 0 1 208,426H30A6,6 0 0 1 24,420V362A6,6 0 0 1 30,356Z" class="f-surface s-axis" stroke-width="1"><title>Each token has 8 routed slots</title></path>
<text x="119" y="380.35" font-size="11" text-anchor="middle" class="f-ink1" font-weight="700">Down GEMM</text>
<text x="119" y="394.85" font-size="11" text-anchor="middle" class="f-ink1">per-slot outputs</text>
<text x="119" y="409.35" font-size="11" text-anchor="middle" class="f-ink1">fp32, per token</text>
<path d="M244,356H422A6,6 0 0 1 428,362V420A6,6 0 0 1 422,426H244A6,6 0 0 1 238,420V362A6,6 0 0 1 244,356Z" class="f-s2 s-s2" stroke-width="1.25" fill-opacity="0.16"><title>fp32 atomic adds, v4 vectors</title></path>
<text x="333" y="380.35" font-size="11" text-anchor="middle" class="f-ink1" font-weight="700">Epilogue</text>
<text x="333" y="394.85" font-size="11" text-anchor="middle" class="f-ink1">red.global.add</text>
<text x="333" y="409.35" font-size="11" text-anchor="middle" class="f-ink1">into the output</text>
<line x1="217" y1="391" x2="231" y2="391" class="s-ink2" stroke-width="1.5" stroke-linecap="butt"/>
<polygon points="236,391 228,395 228,387" class="f-ink2"/>
<path d="M458,356H636A6,6 0 0 1 642,362V420A6,6 0 0 1 636,426H458A6,6 0 0 1 452,420V362A6,6 0 0 1 458,356Z" class="f-s2 s-s2" stroke-width="1.25" fill-opacity="0.16"><title>Repeated scores of one prompt differed at about 1530 of 1537 positions</title></path>
<text x="547" y="380.35" font-size="11" text-anchor="middle" class="f-ink1" font-weight="700">L2 atomic bound</text>
<text x="547" y="394.85" font-size="11" text-anchor="middle" class="f-ink1">order of additions</text>
<text x="547" y="409.35" font-size="11" text-anchor="middle" class="f-ink1">varies between runs</text>
